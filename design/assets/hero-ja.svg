<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="-apple-system, 'Hiragino Sans', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Shiin IME — 母音を打たない日本語キーボード">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaff"/>
      <stop offset="0.55" stop-color="#f4f1fd"/>
      <stop offset="1" stop-color="#ece6fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d6dff"/>
      <stop offset="1" stop-color="#6b4bff"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#6b4bff" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="20" fill="none" stroke="#6b4bff" stroke-opacity="0.10"/>

  <!-- brand row -->
  <g transform="translate(72,56)">
    <rect width="34" height="34" rx="8" fill="url(#accent)"/>
    <circle cx="11" cy="17" r="3" fill="#fff"/>
    <circle cx="19" cy="17" r="3" fill="#fff"/>
    <circle cx="27" cy="17" r="3" fill="#fff" opacity="0.65"/>
    <text x="48" y="24" fill="#1c1b22" font-size="20" font-weight="600">Shiin IME</text>
    <text x="158" y="24" fill="#9a93ad" font-size="20" font-weight="400">子音のみIME</text>
  </g>

  <!-- headline -->
  <g transform="translate(72,150)">
    <text x="0" y="0" fill="#15131c" font-size="50" font-weight="700" letter-spacing="-1">子音だけで、</text>
    <text x="0" y="62" fill="#7b5bff" font-size="50" font-weight="700" letter-spacing="-1">日本語を打つ。</text>
    <text x="0" y="116" fill="#7d7891" font-size="20" font-weight="400">母音を省くオンデバイスキーボード · Transformer + GRU · CoreML · AzooKey</text>
  </g>

  <!-- demo chip -->
  <g transform="translate(800,118)" filter="url(#card)">
    <rect width="328" height="124" rx="16" fill="#ffffff"/>
    <rect x="0.5" y="0.5" width="327" height="123" rx="16" fill="none" stroke="#6b4bff" stroke-opacity="0.12"/>
    <text x="28" y="44" fill="#6b4bff" font-size="30" font-weight="600" font-family="'SF Mono','Menlo',monospace" letter-spacing="3">wtsh</text>
    <text x="150" y="44" fill="#bdb6cf" font-size="26" font-weight="400">→</text>
    <text x="190" y="46" fill="#15131c" font-size="34" font-weight="500">わたし</text>
    <line x1="28" y1="66" x2="300" y2="66" stroke="#15131c" stroke-opacity="0.08"/>
    <text x="28" y="96" fill="#9a93ad" font-size="16" font-weight="400">7打鍵</text>
    <text x="96" y="96" fill="#bdb6cf" font-size="16">→</text>
    <text x="124" y="96" fill="#7b5bff" font-size="16" font-weight="600" font-family="'SF Mono','Menlo',monospace">4</text>
    <text x="150" y="96" fill="#9a93ad" font-size="16" font-weight="400">打鍵 · −43%</text>
  </g>
</svg>
