<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Shiin IME — type Japanese without the vowels">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1b22"/>
      <stop offset="0.55" stop-color="#221f2e"/>
      <stop offset="1" stop-color="#2a2440"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d6dff"/>
      <stop offset="1" stop-color="#6b4bff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>

  <!-- brand row -->
  <g transform="translate(72,56)">
    <rect width="34" height="34" rx="8" fill="url(#accent)"/>
    <circle cx="11" cy="17" r="3" fill="#fff"/>
    <circle cx="19" cy="17" r="3" fill="#fff"/>
    <circle cx="27" cy="17" r="3" fill="#fff" opacity="0.65"/>
    <text x="48" y="24" fill="#f3f1ff" font-size="20" font-weight="600">Shiin IME</text>
    <text x="158" y="24" fill="#8a8699" font-size="20" font-weight="400">子音のみIME</text>
  </g>

  <!-- headline -->
  <g transform="translate(72,150)">
    <text x="0" y="0" fill="#f7f6fb" font-size="52" font-weight="700" letter-spacing="-1.4">Type Japanese</text>
    <text x="0" y="62" fill="#a98cff" font-size="52" font-weight="700" letter-spacing="-1.4">without the vowels.</text>
    <text x="0" y="118" fill="#9d99ad" font-size="20" font-weight="400">On-device consonant-only keyboard · Transformer + GRU · CoreML · AzooKey</text>
  </g>

  <!-- demo chip -->
  <g transform="translate(800,118)">
    <rect width="328" height="124" rx="16" fill="#ffffff" opacity="0.04"/>
    <rect width="328" height="124" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="28" y="44" fill="#c9b6ff" font-size="30" font-weight="600" font-family="'SF Mono','Menlo',monospace" letter-spacing="3">wtsh</text>
    <text x="150" y="44" fill="#6f6b80" font-size="26" font-weight="400">→</text>
    <text x="190" y="46" fill="#f7f6fb" font-size="34" font-weight="500">わたし</text>
    <line x1="28" y1="66" x2="300" y2="66" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="28" y="96" fill="#7f7b90" font-size="16" font-weight="400">7 keystrokes</text>
    <text x="150" y="96" fill="#6f6b80" font-size="16">→</text>
    <text x="178" y="96" fill="#9d7bff" font-size="16" font-weight="600" font-family="'SF Mono','Menlo',monospace">4</text>
    <text x="210" y="96" fill="#7f7b90" font-size="16" font-weight="400">· −43%</text>
  </g>
</svg>
